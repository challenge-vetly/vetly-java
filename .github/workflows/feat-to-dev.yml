name: Feature → Develop

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if gh pr view "$BRANCH" --base develop >/dev/null 2>&1; then
            echo "PR já existe para $BRANCH → develop."
          else
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "Merge $BRANCH into develop" \
              --body "Pull Request criado automaticamente para promover a feature para develop."
          fi