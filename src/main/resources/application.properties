spring.datasource.username=rm565754
spring.datasource.password=071104
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema do usuario FIAP ja existe com as tabelas de DDL.txt criadas manualmente antes do Flyway
# entrar no projeto. baseline-on-migrate marca esse estado atual como V1 sem reexecutar o CREATE TABLE,
# e so aplica de V2 em diante. Um schema novo/vazio (ex.: outro ambiente) executa V1 normalmente.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline - schema gerado a partir de vetly-database/DDL.txt

# Flyway passa a ser a unica fonte de verdade do schema; Hibernate so valida, nunca gera DDL.
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.springframework.security=DEBUG

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# O Swagger UI oferece duas specs no seletor: a gerada automaticamente a partir dos
# controllers e o swagger.yaml escrito a mao (regras de negocio documentadas + mocks
# prontos para o "Try it out"), servido pelo OpenApiDocController.
springdoc.swagger-ui.urls[0].name=Vetly API - documentada (regras de negocio + mocks)
springdoc.swagger-ui.urls[0].url=/swagger.yaml
springdoc.swagger-ui.urls[1].name=Vetly API - gerada a partir do codigo
springdoc.swagger-ui.urls[1].url=/v3/api-docs