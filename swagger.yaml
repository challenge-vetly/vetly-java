        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /consultas/{id}/reagendar:
    patch:
      tags: [Consultas]
      summary: Reagendar (tutor)
      description: |
        **RN-012** — o Responsável remarca pelo app. Só a partir de `AGENDADA`.
        **RN-013 não se aplica**: não há pagamento a transferir no escopo Java,
        a remarcação apenas troca a data.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaReagendarRequest'
            example:
              dataHora: "2026-10-21T09:00:00"
      responses:
        '200':
          description: Consulta reagendada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
              example:
                id: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
                dataHora: "2026-10-21T09:00:00"
                status: AGENDADA
                valor: 180.00
                observacao: Thor está mancando da pata traseira esquerda há três dias.
                animalId: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
                animalNome: Thor
                veterinarioId: 3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
                veterinarioNome: Dra. Ana Oliveira
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Consulta não está mais AGENDADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Só é possível reagendar consultas com status AGENDADA

  /consultas/{id}/cancelar:
    patch:
      tags: [Consultas]
      summary: Cancelar (tutor)
      description: |
        **RN-012** — cancelamento pelo Responsável. `AGENDADA → CANCELADA`.
        Sem cálculo de reembolso (RN-041 a RN-045 pressupõem Pagamento, fora do escopo Java).

        Cancelar **derruba o vínculo clínico** da Colmeia: se essa era a única consulta
        entre o vet e o animal, ele perde o acesso ao histórico (RN-064).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
      responses:
        '200':
          description: Consulta cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
              example:
                id: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
                dataHora: "2026-10-14T14:30:00"
                status: CANCELADA
                valor: 180.00
                observacao: Thor está mancando da pata traseira esquerda há três dias.
                animalId: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
                animalNome: Thor
                veterinarioId: 3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
                veterinarioNome: Dra. Ana Oliveira
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Transição inválida (consulta já saiu de AGENDADA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: "Transição inválida: consulta está em REALIZADA, não é possível ir para CANCELADA"

  /consultas/{id}/realizar:
    patch:
      tags: [Consultas]
      summary: Marcar como realizada (veterinário)
      description: |
        **RN-008/RN-038** — o encerramento é ação do veterinário designado.
        `AGENDADA → REALIZADA`. Sem IA acoplada (RN-078 a RN-085 são escopo `.NET`),
        isso apenas fecha o registro do atendimento.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
      responses:
        '200':
          description: Consulta realizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
              example:
                id: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
                dataHora: "2026-10-14T14:30:00"
                status: REALIZADA
                valor: 180.00
                observacao: Thor está mancando da pata traseira esquerda há três dias.
                animalId: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
                animalNome: Thor
                veterinarioId: 3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
                veterinarioNome: Dra. Ana Oliveira
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Não é o veterinário designado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Somente o veterinário responsável pode realizar esta ação
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Transição inválida

  /consultas/{id}/nao-compareceu:
    patch:
      tags: [Consultas]
      summary: Marcar não comparecimento (veterinário)
      description: |
        **RN-038** — estado terminal `no-show`. `AGENDADA → NAO_COMPARECEU`,
        registrado pelo veterinário designado.
