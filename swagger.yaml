                    especialidadeVet:
                      - id: c3d4e5f6-a7b8-9012-cdef-123456789012
                        nome: CARDIOLOGIA
                        descricao: Diagnóstico e tratamento de doenças do coração em animais.
                    link:
                      href: http://localhost:8080/veterinarios/3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
                totalElements: 1
                totalPages: 1
                number: 0
                size: 5
                first: true
                last: true
        '404':
