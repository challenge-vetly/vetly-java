openapi: 3.0.3
info:
  title: Vetly — API Backend (Java)
  version: 1.0.0
  description: |
    API REST do backend **Vetly** em Java/Spring Boot — fatia de domínio
    **Animal · Consulta · Prontuário · Colmeia · Exame**, mais Auth, Usuário,
    Espécie, Especialidade e Veterinário.

    Este serviço é uma implementação **independente** do backend `.NET`: identidade,
    banco e dados são próprios, não há integração entre os dois.

    ## Autenticação
    JWT Bearer. Fluxo:
    1. `POST /auth/login` com e-mail e senha.
    2. Copie o `token` da resposta.
    3. Envie `Authorization: Bearer <token>` nas demais requisições
       (no Swagger UI: botão **Authorize**).

    ## Papéis
    | Role | O que faz nesta API |
    |------|---------------------|
    | `ADMIN` | Gerencia usuários, espécies e especialidades |
    | `TUTOR` | Cadastra animais, agenda/cancela consultas, lê prontuário e logs de acesso, gerencia consentimento |
    | `VETERINARIO` | Marca consulta como realizada/não compareceu, escreve prontuário, solicita e libera exames |

    ## Regras de acesso (Spring Security)
    - `POST /auth/**` — público
    - `GET /especies`, `GET /especialidades`, `GET /veterinarios/**` — público
    - `/usuarios`, `/especies`, `/especialidades` (POST/PUT/DELETE) — somente `ADMIN`
    - Demais rotas — autenticado; o **escopo por dono** é aplicado no service
      (tutor só enxerga os próprios animais/consultas; vet só as consultas em que é o designado)

    ## Regras de negócio implementadas
    A numeração `RN-xxx` segue `vetly-qa/vetly-tech.md` (fonte de verdade).
    Cada operação afetada cita a RN na própria descrição.

    | RN | Onde aparece nesta API |
    |----|------------------------|
    | RN-003 | `POST /consultas` — consulta atribuída diretamente ao vet escolhido |
    | RN-008 | `PATCH /consultas/{id}/realizar` — encerramento por ação do vet |
    | RN-012 | `PATCH /consultas/{id}/cancelar` e `/reagendar` — ação do Responsável |
    | RN-038 | Máquina de estados `AGENDADA → REALIZADA \| CANCELADA \| NAO_COMPARECEU` |
    | RN-060/062 | `PUT /tutores/me/consentimento` — aceite LGPD com data/hora e revogação |
    | RN-063 | `/animais/{id}/prontuario` — prontuário pendurado no animal, não no vet |
    | RN-064/066 | `GET /animais/{id}/historico` — Colmeia: vínculo clínico concede acesso; sem consentimento de rede, só o que o vet produziu |
    | RN-067 | `GET /animais/{id}/logs-acesso` — todo acesso de vet é logado e visível ao tutor |
    | RN-068 | Histórico do tutor oculta registros marcados, **exceto** alertas de segurança |
    | RN-081 | `peso` obrigatório em `POST/PUT /animais` |
    | RN-088/089 | `POST /animais/{id}/prontuario/correcoes` — original nunca sobrescrito; justificativa fora da janela de 24h |
    | RN-103 | `POST /consultas/{id}/solicitacoes-exame` — exame solicitado na plataforma e vinculado ao histórico |
    | RN-104 | `PATCH /solicitacoes-exame/itens/{id}/liberar` — resultado só chega ao tutor após liberação explícita do vet |

    ## Roteiro de teste (os exemplos abaixo formam um cenário único)
    Todos os `example` deste documento usam os mesmos IDs e são encadeáveis:

    1. `POST /auth/register/tutor` → tutor `maria.souza@vetly.com.br` / `Tutor@123`
    2. `POST /auth/register/veterinario` → vet `dra.ana@vetly.com.br` / `Senha@456`
    3. `POST /auth/login` (admin) → `POST /especies` com `{"nome":"CAO"}` → guarde o `id` da espécie
    4. `POST /auth/login` (tutor) → `POST /animais` (Thor) → guarde o `id`
    5. `PUT /tutores/me/consentimento` → `lgpdAceito: true`, `consentimentoRede: true`
    6. `POST /consultas` (tutor, com `animalId` + `veterinarioId`) → status `AGENDADA`
    7. `POST /auth/login` (vet) → `GET /animais/{animalId}/historico` (Colmeia concede acesso e grava log)
    8. `POST /animais/{animalId}/prontuario` → `POST .../prontuario/correcoes`
    9. `POST /consultas/{consultaId}/solicitacoes-exame` → `PATCH .../resultado` → `POST .../anexos` → `PATCH .../liberar`
    10. `PATCH /consultas/{consultaId}/realizar` (vet)
    11. Volte como tutor: `GET /animais/{animalId}/logs-acesso` e `GET /consultas/{consultaId}/solicitacoes-exame`

    ## Convenção de erros
    Todo erro tratado responde `{"error": "<mensagem>"}`, exceto falha de validação
    de payload, que responde `{"<campo>": "<mensagem>"}`.

    | Status | Quando |
    |--------|--------|
    | `400` | Bean Validation falhou no corpo ou no parâmetro |
    | `401` | Sem token / token inválido — `{"error":"Recurso protegido"}` |
    | `403` | Papel errado ou recurso de outro dono (`AccessDeniedException`) |
    | `404` | Entidade não encontrada (`EntityNotFoundException`) ou rota inexistente |
    | `409` | Transição de estado inválida ou violação de unicidade (`IllegalArgumentException`, `DataIntegrityViolationException`) |
    | `500` | Erro não tratado |
  contact:
    name: Equipe Vetly
  license:
    name: Proprietário

servers:
  - url: http://localhost:8080
    description: Ambiente de desenvolvimento local

tags:
  - name: Autenticação
    description: Login e auto-registro de tutor, veterinário e administrador
  - name: Usuários
    description: Gerenciamento de contas (apenas ADMIN)
  - name: Espécies
    description: Tabela de domínio de espécies animais
  - name: Especialidades
    description: Tabela de domínio de especialidades veterinárias
  - name: Veterinários
    description: Consulta pública ao diretório de veterinários
  - name: Tutores
    description: Consentimento LGPD e de rede do tutor autenticado (RN-060/062)
  - name: Animais
    description: CRUD do animal, escopado ao tutor dono (RN-081)
  - name: Consultas
    description: Agendamento e máquina de estados da consulta (RN-003/008/012/038)
  - name: Colmeia
    description: Acesso ao histórico clínico e log de acessos (RN-064 a RN-068)
  - name: Prontuário
    description: Prontuário do animal com versionamento original × correção (RN-063/088/089)
  - name: Exames
    description: Solicitação, resultado, anexo e liberação ao Responsável (RN-103/104)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido em `POST /auth/login`.

  parameters:
    PageNumber:
      name: pageNumber
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Página (base 0). O tamanho da página é fixo por endpoint.
      example: 0

  responses:
    NaoAutenticado:
      description: Token ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: Recurso protegido
    AcessoNegado:
      description: Papel incorreto ou recurso pertencente a outro usuário
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: Animal não pertence ao tutor autenticado
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            error: "Animal não encontrado: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04"
    ErroValidacao:
      description: "Falha de Bean Validation — um par `campo: mensagem` por erro"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroValidacao'
          example:
            peso: deve ser maior que zero
            nome: nao pode ser vazio

  schemas:

    # ─── Erros ───────────────────────────────────────────────
    Erro:
      type: object
      properties:
        error:
          type: string
          example: Acesso negado

    ErroValidacao:
      type: object
      additionalProperties:
        type: string
      description: Mapa `campo → mensagem` produzido pelo `GlobalExceptionHandler`.

    # ─── Enums ───────────────────────────────────────────────
    UserRole:
      type: string
      enum: [ADMIN, TUTOR, VETERINARIO]
      description: Papel do usuário no sistema
      example: TUTOR

    Sexo:
      type: string
      enum: [M, F]
      example: M

    StatusConsulta:
      type: string
      enum: [AGENDADA, CANCELADA, REALIZADA, NAO_COMPARECEU]
      description: |
        RN-038 (adaptado ao escopo Java — sem `EM_CHECKOUT`, que só existe por causa
        do pagamento). Toda transição parte obrigatoriamente de `AGENDADA`.
      example: AGENDADA

    StatusExame:
      type: string
      enum: [SOLICITADO, AGUARDANDO_RESULTADO, ANALISADO, RESULTADO_ENVIADO, CANCELADO]
      description: |
        Ciclo do item de exame: `SOLICITADO` → (resultado registrado) `ANALISADO`
        → (liberação explícita ao Responsável, RN-104) `RESULTADO_ENVIADO`.
        `RESULTADO_ENVIADO` significa **liberado ao Responsável**, não "enviado ao vet".
      example: SOLICITADO

    BaseAcesso:
      type: string
      enum: [CONSENTIMENTO_REDE, ATENDIMENTO_DIRETO]
      description: |
        Base legal registrada no log de acesso (RN-067):
        `CONSENTIMENTO_REDE` quando o tutor autorizou o compartilhamento em rede
        (vet vê o histórico completo — RN-064); `ATENDIMENTO_DIRETO` quando não há
        consentimento e o vet vê apenas o que produziu (RN-066).
      example: CONSENTIMENTO_REDE

    NomeEspecie:
      type: string
      enum: [AVE, REPTIL, MAMIFERO, ANFIBIO, PEIXE, EQUIDEO, CAO, GATO]
      example: CAO

    NomeEspecialidade:
      type: string
      enum:
        - ACUPUNTURA
        - ANESTESIOLOGIA
        - CARDIOLOGIA
        - CIRURGIA
        - DERMATOLOGIA
        - ENDOCRINOLOGIA
        - FISIOTERAPIA
        - GERIATRIA
        - HOMEOPATIA
        - MEDICINA_ANIMAIS_SELVAGENS
        - MEDICINA_DO_COLETIVO
        - MEDICINA_INTENSIVA
        - NEFROLOGIA_E_UROLOGIA
        - NEUROLOGIA
        - NUTROLOGIA
        - ODONTOLOGIA
        - OFTALMOLOGIA
        - PATOLOGIA
        - PEQUENOS_ANIMAIS
        - PNEUMOLOGIA
        - RADIOLOGIA
      example: CARDIOLOGIA

    Senha:
      type: string
      description: |
        Mínimo 8 caracteres, com maiúscula, minúscula, número e caractere
        especial (`@$!%*?&`).
      example: Senha@456

    HateoasLink:
      type: object
      description: Link HATEOAS para o recurso completo
      properties:
        href:
          type: string
          format: uri
          example: http://localhost:8080/especialidades/c3d4e5f6-a7b8-9012-cdef-123456789012

    Pagina:
      type: object
      description: Envelope de paginação do Spring Data (campos principais)
      properties:
        totalElements:
          type: integer
          example: 3
        totalPages:
          type: integer
          example: 1
        number:
          type: integer
          description: Página atual (base 0)
          example: 0
        size:
          type: integer
          example: 10
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: true

    # ─── Auth ───────────────────────────────────────────────
    AuthDTO:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: maria.souza@vetly.com.br
        senha:
          $ref: '#/components/schemas/Senha'

    LoginResponseDTO:
      type: object
      properties:
        token:
          type: string
          description: JWT de acesso
          example: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJ2ZXRseS1qYXZhIn0.OZ4dJ9mQq2sJ8XKfPZK1oJmWUw3s9L6r0Cq7c8v1kAY

    RegisterTutorDTO:
      type: object
      required: [email, senha, nome, cpf, telefone]
      properties:
        email:
          type: string
          format: email
          example: maria.souza@vetly.com.br
        senha:
          $ref: '#/components/schemas/Senha'
        nome:
          type: string
          maxLength: 100
          example: Maria Souza
        cpf:
          type: string
          description: CPF válido, somente números (validado por `@CPF`)
          example: "52998224725"
        telefone:
          type: string
          description: "Formato aceito: (11) 91234-5678"
          example: "(11) 98765-4321"

    RegisterVeterinarioDTO:
      type: object
      required: [email, senha, crmv, nome, cpf, telefone, especialidades, especies]
      properties:
        email:
          type: string
          format: email
          example: dra.ana@vetly.com.br
        senha:
          $ref: '#/components/schemas/Senha'
        crmv:
          type: string
          description: Registro profissional. **Não é validado junto ao conselho** — RN-107 está fora do escopo do Java.
          example: SP-98765
        nome:
          type: string
          maxLength: 100
          example: Dra. Ana Oliveira
        cpf:
          type: string
          example: "98765432100"
        telefone:
          type: string
          example: "(11) 97654-3210"
        especialidades:
          type: array
          items:
            $ref: '#/components/schemas/NomeEspecialidade'
          example: [CARDIOLOGIA, PEQUENOS_ANIMAIS]
        especies:
          type: array
          items:
            $ref: '#/components/schemas/NomeEspecie'
          example: [CAO, GATO]

    RegisterAdminDTO:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: admin@vetly.com.br
        senha:
          $ref: '#/components/schemas/Senha'

    # ─── Usuário ─────────────────────────────────────────────
    UsuarioDTO:
      type: object
      required: [email, role, flagAtivo, senha]
      properties:
        email:
          type: string
          format: email
          example: novo@vetly.com.br
        role:
          $ref: '#/components/schemas/UserRole'
        flagAtivo:
          type: string
          enum: [S, N]
          example: "S"
        senha:
          $ref: '#/components/schemas/Senha'

    UsuarioResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        email:
          type: string
          format: email
          example: maria.souza@vetly.com.br
        role:
          $ref: '#/components/schemas/UserRole'
        flagAtivo:
          type: string
          enum: [S, N]
          example: "S"

    UsuarioLista:
      type: object
      description: Projeção resumida para listagens paginadas
      properties:
        email:
          type: string
          format: email
          example: maria.souza@vetly.com.br
        link:
          $ref: '#/components/schemas/HateoasLink'

    PageUsuarioLista:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UsuarioLista'

    # ─── Espécie / Especialidade ─────────────────────────────
    EspecieRequest:
      type: object
      required: [nome]
      properties:
        nome:
          $ref: '#/components/schemas/NomeEspecie'

    Especie:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        nome:
          $ref: '#/components/schemas/NomeEspecie'

    EspecialidadeVetRequest:
      type: object
      required: [nome, descricao]
      properties:
        nome:
          $ref: '#/components/schemas/NomeEspecialidade'
        descricao:
          type: string
          maxLength: 150
          example: Diagnóstico e tratamento de doenças do coração em animais.

    EspecialidadeVet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        nome:
          $ref: '#/components/schemas/NomeEspecialidade'
        descricao:
          type: string
          example: Diagnóstico e tratamento de doenças do coração em animais.

    EspecialidadeVetLista:
      type: object
      properties:
        nome:
          $ref: '#/components/schemas/NomeEspecialidade'
        link:
          $ref: '#/components/schemas/HateoasLink'

    PageEspecialidadeVetLista:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/EspecialidadeVetLista'

    # ─── Veterinário ─────────────────────────────────────────
    VeterinarioResponse:
      type: object
      properties:
        nome:
          type: string
          example: Dra. Ana Oliveira
        crmv:
          type: string
          example: SP-98765
        especialidades:
          type: array
          items:
            type: string
          example: [CARDIOLOGIA, PEQUENOS_ANIMAIS]

    VeterinarioLista:
      type: object
      properties:
        nome:
          type: string
          example: Dra. Ana Oliveira
        crmv:
          type: string
          example: SP-98765
        especialidadeVet:
          type: array
          items:
            $ref: '#/components/schemas/EspecialidadeVet'
        link:
          $ref: '#/components/schemas/HateoasLink'

    PageVeterinarioLista:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/VeterinarioLista'

    # ─── Tutor / consentimento (RN-060 a RN-062) ─────────────
    TutorConsentimentoRequest:
      type: object
      required: [lgpdAceito, consentimentoRede]
      properties:
        lgpdAceito:
          type: boolean
          description: Aceite do tratamento de dados. Grava a data no primeiro `true` (RN-060).
          example: true
        consentimentoRede:
          type: boolean
          description: |
            Autoriza o compartilhamento do histórico com qualquer vet que tenha vínculo
            clínico com o animal (RN-064). Com `false`, o vet só enxerga o que produziu
            (RN-066) — e a data do consentimento é limpa, registrando a revogação (RN-062).
          example: true

    TutorConsentimentoResponse:
      type: object
      properties:
        lgpdAceito:
          type: boolean
          example: true
        dataLgpdAceito:
          type: string
          format: date
          nullable: true
          example: "2026-09-05"
        consentimentoRede:
          type: boolean
          example: true
        dataConsentimentoRede:
          type: string
          format: date
          nullable: true
          example: "2026-09-05"

    # ─── Animal (RN-081, RN-068) ─────────────────────────────
    AnimalRequest:
      type: object
      required: [nome, raca, sexo, peso, especieId, castrado]
      properties:
        nome:
          type: string
          maxLength: 80
          example: Thor
        raca:
          type: string
          maxLength: 80
          example: Golden Retriever
        sexo:
          $ref: '#/components/schemas/Sexo'
        dataNascimento:
          type: string
          format: date
          description: Não pode ser futura.
          example: "2021-03-14"
        peso:
          type: number
          format: double
          minimum: 0.01
          description: |
            Peso em kg, obrigatório e maior que zero (RN-081 — sem peso não se
            registra posologia). Até 3 inteiros e 2 decimais.
          example: 32.40
        especieId:
          type: string
          format: uuid
          description: ID de uma espécie existente (`GET /especies`).
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        urlFoto:
          type: string
          maxLength: 500
          nullable: true
          example: https://cdn.vetly.com.br/animais/thor.jpg
        castrado:
          type: boolean
          example: true
        condicoesPreexistentes:
          type: string
          maxLength: 1000
          nullable: true
          example: Displasia coxofemoral leve diagnosticada em 2024.
        alergias:
          type: string
          maxLength: 1000
          nullable: true
          description: Alimenta os alertas de segurança do histórico, que nunca podem ser ocultados (RN-068).
          example: Alergia a dipirona.
        medicacoesEmUso:
          type: string
          maxLength: 1000
          nullable: true
          example: Condroitina 500mg, 1x ao dia.

    AnimalResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
        nome:
          type: string
          example: Thor
        raca:
          type: string
          example: Golden Retriever
        sexo:
          $ref: '#/components/schemas/Sexo'
        dataNascimento:
          type: string
          format: date
          example: "2021-03-14"
        peso:
          type: number
          example: 32.40
        especie:
          type: string
          description: Nome da espécie (enum `NomeEspecie`), não o ID.
          example: CAO
        urlFoto:
          type: string
          nullable: true
          example: https://cdn.vetly.com.br/animais/thor.jpg
        castrado:
          type: boolean
          example: true
        condicoesPreexistentes:
          type: string
          nullable: true
          example: Displasia coxofemoral leve diagnosticada em 2024.
        alergias:
          type: string
          nullable: true
          example: Alergia a dipirona.
        medicacoesEmUso:
          type: string
          nullable: true
          example: Condroitina 500mg, 1x ao dia.

    PageAnimalResponse:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AnimalResponse'

    # ─── Consulta (RN-003, RN-008, RN-012, RN-038) ───────────
    ConsultaRequest:
      type: object
      required: [animalId, veterinarioId, dataHora, valor]
      properties:
        animalId:
          type: string
          format: uuid
          description: Animal do tutor autenticado — animal de outro tutor devolve `403`.
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
        veterinarioId:
          type: string
          format: uuid
          description: Vet escolhido diretamente pelo tutor (RN-003) — obtido em `GET /veterinarios`.
          example: 3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
        dataHora:
          type: string
          format: date-time
          description: Deve estar no futuro.
          example: "2026-10-14T14:30:00"
        valor:
          type: number
          format: double
          minimum: 0.01
          description: Valor combinado. O Java **não** processa pagamento — é só registro.
          example: 180.00
        observacao:
          type: string
          maxLength: 500
          nullable: true
          example: Thor está mancando da pata traseira esquerda há três dias.

    ConsultaReagendarRequest:
      type: object
      required: [dataHora]
      properties:
        dataHora:
          type: string
          format: date-time
          description: Nova data/hora, obrigatoriamente futura (RN-012).
          example: "2026-10-21T09:00:00"

    ConsultaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
        dataHora:
          type: string
          format: date-time
          example: "2026-10-14T14:30:00"
        status:
          $ref: '#/components/schemas/StatusConsulta'
        valor:
          type: number
          example: 180.00
        observacao:
          type: string
          nullable: true
          example: Thor está mancando da pata traseira esquerda há três dias.
        animalId:
          type: string
          format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
        animalNome:
          type: string
          example: Thor
        veterinarioId:
          type: string
          format: uuid
          example: 3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
        veterinarioNome:
          type: string
          example: Dra. Ana Oliveira

    PageConsultaResponse:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/ConsultaResponse'

    # ─── Colmeia (RN-064 a RN-068) ───────────────────────────
    EvolucaoClinicaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 6b2f9d40-8e17-4a35-9c82-0d3f7b1a5e26
        anotacoes:
          type: string
          example: Claudicação grau II em MPE. Prescrito anti-inflamatório por 5 dias e repouso.
        dataConsulta:
          type: string
          format: date-time
          example: "2026-10-14T14:30:00"
        veterinarioNome:
          type: string
          example: Dra. Ana Oliveira
        alertaSeguranca:
          type: boolean
          description: |
            Quando `true`, o registro **nunca** é ocultado do Responsável, mesmo que
            esteja marcado como oculto (RN-068).
          example: false

    LogAcessoProntuarioResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 2e9c4b81-3d67-45a0-b8f2-1c7e5a9d0f34
        dataHoraAcesso:
          type: string
          format: date-time
          example: "2026-09-05T10:12:44"
        contextoAcesso:
          type: string
          nullable: true
          description: Texto livre enviado pelo vet no parâmetro `contexto`, ou o rótulo gravado pelo prontuário.
          example: Consulta de retorno
        baseAcesso:
          $ref: '#/components/schemas/BaseAcesso'
        veterinarioNome:
          type: string
          example: Dra. Ana Oliveira

    PageLogAcessoProntuarioResponse:
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/LogAcessoProntuarioResponse'

    # ─── Prontuário (RN-063, RN-088, RN-089) ─────────────────
    ProntuarioRequest:
      type: object
      required: [conteudoClinico]
      properties:
        conteudoClinico:
          type: string
          example: |
            Anamnese: claudicação em MPE há 3 dias, sem trauma relatado.
            Exame físico: dor à extensão do quadril esquerdo; FC 92 bpm; T 38,6 °C.
            Conduta: radiografia de quadril e anti-inflamatório por 5 dias.

    ProntuarioCorrecaoRequest:
      type: object
      required: [conteudoClinico]
      properties:
        conteudoClinico:
          type: string
          description: Conteúdo corrigido. Não sobrescreve o original — cria uma nova versão vinculada a ele (RN-088).
          example: |
            Anamnese: claudicação em MPE há 3 dias, sem trauma relatado.
            Exame físico: dor à extensão do quadril esquerdo; FC 92 bpm; T 38,6 °C.
            Conduta: radiografia de quadril e anti-inflamatório por 7 dias (corrigido).
        justificativa:
          type: string
          maxLength: 1000
          nullable: true
          description: |
            Obrigatória apenas quando a correção ocorre **fora da janela de 24h** da
            criação do prontuário original (RN-089); dentro da janela é ignorada.
          example: Ajuste de posologia após revisão do laudo radiográfico.

    ProntuarioResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 8c5f1d29-7a34-4e6b-91c0-2d8b4f7a3e15
        conteudoClinico:
          type: string
          example: "Anamnese: claudicação em MPE há 3 dias..."
        dataUltimaAtualizacao:
          type: string
          format: date
          example: "2026-09-05"
        original:
          type: boolean
          description: "`true` na versão original; `false` em cada correção."
          example: true
        dataHoraCorrecao:
          type: string
          format: date-time
          nullable: true
          description: Preenchida apenas em correções.
          example: null
        crmvSolicitanteCorrecao:
          type: string
          nullable: true
          description: CRMV do vet que assinou a correção (RN-088).
          example: null
        justificativaCorrecao:
          type: string
          nullable: true
          description: Preenchida apenas em correções fora da janela de 24h (RN-089).
          example: null

    # ─── Exames (RN-103, RN-104) ─────────────────────────────
    SolicitacaoExameRequest:
      type: object
      required: [itens]
      properties:
        observacao:
          type: string
          maxLength: 300
          nullable: true
          example: Jejum de 8 horas antes da coleta.
        itens:
          type: array
          minItems: 1
          items:
            type: object
            required: [nomeExame]
            properties:
              nomeExame:
                type: string
                maxLength: 100
                example: Hemograma completo

    ResultadoExameRequest:
      type: object
      required: [descricaoResultado]
      properties:
        descricaoResultado:
          type: string
          maxLength: 500
          example: Leucograma dentro da normalidade; leve anemia normocítica normocrômica.

    AnexoExameRequest:
      type: object
      required: [urlArquivo, mimeType]
      properties:
        urlArquivo:
          type: string
          maxLength: 500
          description: URL do arquivo já hospedado. A API **não** recebe o binário (RN-104, upload feito fora).
          example: https://cdn.vetly.com.br/exames/thor-hemograma-2026-10-14.pdf
        mimeType:
          type: string
          maxLength: 30
          example: application/pdf

    AnexoExameResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1a4e8c37-6b90-42d5-8e71-3f2c9d0a5b68
        urlArquivo:
          type: string
          example: https://cdn.vetly.com.br/exames/thor-hemograma-2026-10-14.pdf
        mimeType:
          type: string
          example: application/pdf
        dataUpload:
          type: string
          format: date
          example: "2026-10-15"

    SolicitacaoExameItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
        nomeExame:
          type: string
          example: Hemograma completo
        status:
          $ref: '#/components/schemas/StatusExame'
        dataSolicitacao:
          type: string
          format: date
          example: "2026-10-14"
        dataResultado:
          type: string
          format: date
          nullable: true
          description: "`null` para o tutor enquanto `liberadoResponsavel` for `false` (RN-104)."
          example: "2026-10-15"
        descricaoResultado:
          type: string
          nullable: true
          description: "`null` para o tutor enquanto `liberadoResponsavel` for `false` (RN-104)."
          example: Leucograma dentro da normalidade; leve anemia normocítica normocrômica.
        liberadoResponsavel:
          type: boolean
          example: false
        dataLiberacaoResponsavel:
          type: string
          format: date
          nullable: true
          example: null
        anexos:
          type: array
          description: Lista vazia para o tutor enquanto o item não estiver liberado (RN-104).
          items:
            $ref: '#/components/schemas/AnexoExameResponse'

    SolicitacaoExameResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: e21b6c74-9f3a-4d18-b5e7-0c4a2f8d6b19
        observacao:
          type: string
          nullable: true
          example: Jejum de 8 horas antes da coleta.
        consultaId:
          type: string
          format: uuid
          example: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
        animalNome:
          type: string
          example: Thor
        veterinarioNome:
          type: string
          example: Dra. Ana Oliveira
        itens:
          type: array
          items:
            $ref: '#/components/schemas/SolicitacaoExameItemResponse'

paths:

  # ══════════════════════════════════════════
  # AUTENTICAÇÃO
  # ══════════════════════════════════════════
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autenticar e obter o JWT
      description: |
        Valida e-mail e senha e devolve o token usado em todas as rotas protegidas.

        **Mock — use um dos três atores do roteiro de teste** (veja os exemplos ao lado):
        tutor, veterinário ou administrador.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthDTO'
            examples:
              tutor:
                summary: Tutor (Maria)
                value:
                  email: maria.souza@vetly.com.br
                  senha: "Tutor@123"
              veterinario:
                summary: Veterinária (Dra. Ana)
                value:
                  email: dra.ana@vetly.com.br
                  senha: "Senha@456"
              admin:
                summary: Administrador
                value:
                  email: admin@vetly.com.br
                  senha: "Admin@123"
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          description: Credenciais inválidas — corpo em texto puro
          content:
            text/plain:
              schema:
                type: string
              examples:
                usuario_nao_encontrado:
                  value: Usuário não encontrado
                senha_incorreta:
                  value: Senha incorreta

  /auth/register/tutor:
    post:
      tags: [Autenticação]
      summary: Auto-registro de tutor
      description: |
        Cria, em uma transação, `TB_USUARIO` (role `TUTOR`), `TB_PESSOA` e `TB_TUTOR`.
        O tutor é ator de primeira classe nesta API — agenda sozinho, sem intermediação
        de clínica.

        O consentimento nasce **não aceito**: use `PUT /tutores/me/consentimento`
        logo após o primeiro login (RN-060).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTutorDTO'
            example:
              email: maria.souza@vetly.com.br
              senha: "Tutor@123"
              nome: Maria Souza
              cpf: "52998224725"
              telefone: "(11) 98765-4321"
      responses:
        '201':
          description: Tutor registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
              example:
                id: 7d1e4c85-2a90-4b63-8f17-5c9a0d3e6b28
                email: maria.souza@vetly.com.br
                role: TUTOR
                flagAtivo: "S"
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '409':
          description: E-mail, CPF/telefone já cadastrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Email já cadastrado

  /auth/register/veterinario:
    post:
      tags: [Autenticação]
      summary: Auto-registro de veterinário
      description: |
        Cria `TB_USUARIO` (role `VETERINARIO`), `TB_PESSOA`, `TB_VETERINARIO`,
        `TB_VETERINARIO_ESPECIALIDADE` e `TB_VETERINARIO_ESPECIE` transacionalmente.

        As especialidades e espécies informadas precisam já existir
        (`POST /especialidades` e `POST /especies`, feitos pelo ADMIN).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVeterinarioDTO'
            example:
              email: dra.ana@vetly.com.br
              senha: "Senha@456"
              crmv: SP-98765
              nome: Dra. Ana Oliveira
              cpf: "98765432100"
              telefone: "(11) 97654-3210"
              especialidades: [CARDIOLOGIA, PEQUENOS_ANIMAIS]
              especies: [CAO, GATO]
      responses:
        '201':
          description: Veterinário registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
              example:
                id: 3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
                email: dra.ana@vetly.com.br
                role: VETERINARIO
                flagAtivo: "S"
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '409':
          description: E-mail, CPF/telefone ou CRMV já cadastrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: CRMV já cadastrado

  /auth/register/admin:
    post:
      tags: [Autenticação]
      summary: Registrar administrador
      description: Cria uma conta com papel `ADMIN`. Endpoint público — proteja-o antes de ir a produção.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAdminDTO'
            example:
              email: admin@vetly.com.br
              senha: "Admin@123"
      responses:
        '201':
          description: Administrador criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                email: admin@vetly.com.br
                role: ADMIN
                flagAtivo: "S"
        '400':
          description: E-mail já cadastrado (corpo vazio) ou falha de validação

  # ══════════════════════════════════════════
  # USUÁRIOS (ADMIN)
  # ══════════════════════════════════════════
  /usuarios:
    post:
      tags: [Usuários]
      summary: Criar usuário
      description: Cria uma conta de qualquer papel, sem o perfil associado (Pessoa/Tutor/Veterinário). Requer `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioDTO'
            example:
              email: novo@vetly.com.br
              role: ADMIN
              flagAtivo: "S"
              senha: "Admin@456"
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

    get:
      tags: [Usuários]
      summary: Listar usuários (paginado)
      description: Página de 5 registros ordenada por e-mail, com link HATEOAS por item. Requer `ADMIN`.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUsuarioLista'
              example:
                content:
                  - email: admin@vetly.com.br
                    link:
                      href: http://localhost:8080/usuarios/a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  - email: dra.ana@vetly.com.br
                    link:
                      href: http://localhost:8080/usuarios/3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
                  - email: maria.souza@vetly.com.br
                    link:
                      href: http://localhost:8080/usuarios/7d1e4c85-2a90-4b63-8f17-5c9a0d3e6b28
                totalElements: 3
                totalPages: 1
                number: 0
                size: 5
                first: true
                last: true
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: Nenhum usuário na página solicitada (corpo vazio)

  /usuarios/{id}:
    get:
      tags: [Usuários]
      summary: Buscar usuário por ID
      description: Requer `ADMIN`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 7d1e4c85-2a90-4b63-8f17-5c9a0d3e6b28
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ══════════════════════════════════════════
  # ESPÉCIES
  # ══════════════════════════════════════════
  /especies:
    get:
      tags: [Espécies]
      summary: Listar espécies
      description: |
        Lista completa, **sem paginação** (o conjunto de espécies é fixo por design).
        Endpoint público — é daqui que sai o `especieId` usado em `POST /animais`.
      security: []
      responses:
        '200':
          description: Espécies cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Especie'
              example:
                - id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  nome: CAO
                - id: d4e5f6a7-b8c9-0123-def1-234567890123
                  nome: GATO

    post:
      tags: [Espécies]
      summary: Criar espécie
      description: Requer `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecieRequest'
            example:
              nome: CAO
      responses:
        '201':
          description: Espécie criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especie'
              example:
                id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                nome: CAO
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: Espécie já cadastrada

    put:
      tags: [Espécies]
      summary: Atualizar espécie
      description: O `id` vai **no corpo**, não na URL. Requer `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Especie'
            example:
              id: b2c3d4e5-f6a7-8901-bcde-f12345678901
              nome: CAO
      responses:
        '201':
          description: Espécie atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especie'
        '400':
          description: Nenhuma espécie com o `id` informado
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /especies/{id}:
    get:
      tags: [Espécies]
      summary: Buscar espécie por ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
      responses:
        '200':
          description: Espécie encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Especie'
        '404':
          description: Espécie não encontrada

    delete:
      tags: [Espécies]
      summary: Excluir espécie
      description: Requer `ADMIN`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
      responses:
        '200':
          description: Espécie removida
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: Espécie referenciada por algum animal

  # ══════════════════════════════════════════
  # ESPECIALIDADES
  # ══════════════════════════════════════════
  /especialidades:
    get:
      tags: [Especialidades]
      summary: Listar especialidades (paginado)
      description: |
        Página de **2 registros** ordenada por nome, com link HATEOAS por item.
        Endpoint público.

        > Não há filtro por `nome`/`descricao` nesta rota — o único parâmetro
        > aceito é `pageNumber`. Para buscar profissionais por especialidade use
        > `GET /veterinarios?especialidade=`.
      security: []
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Página de especialidades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEspecialidadeVetLista'
              example:
                content:
                  - nome: CARDIOLOGIA
                    link:
                      href: http://localhost:8080/especialidades/c3d4e5f6-a7b8-9012-cdef-123456789012
                  - nome: PEQUENOS_ANIMAIS
                    link:
                      href: http://localhost:8080/especialidades/e5f6a7b8-c9d0-1234-ef12-345678901234
                totalElements: 2
                totalPages: 1
                number: 0
                size: 2
                first: true
                last: true

    post:
      tags: [Especialidades]
      summary: Criar especialidade
      description: Requer `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialidadeVetRequest'
            example:
              nome: CARDIOLOGIA
              descricao: Diagnóstico e tratamento de doenças do coração em animais.
      responses:
        '201':
          description: Especialidade criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadeVet'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
