      responses:
        '200':
          description: Especialidade removida
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '409':
          description: Especialidade vinculada a algum veterinário

  # ══════════════════════════════════════════
  # VETERINÁRIOS
  # ══════════════════════════════════════════
  /veterinarios:
    get:
      tags: [Veterinários]
      summary: Listar veterinários, opcionalmente por especialidade
      description: |
        Página de 5 registros ordenada pelo nome da pessoa. Endpoint **público** —
        é daqui que o tutor tira o `veterinarioId` para `POST /consultas`.

        Sem `especialidade`, lista todos; com `especialidade`, filtra pelo nome do
        enum `NomeEspecialidade` (valor exato).

        > Não há matching por geolocalização aqui — RN-026 a RN-033 são escopo do backend `.NET`.
      security: []
      parameters:
        - name: especialidade
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NomeEspecialidade'
          description: Nome exato da especialidade.
          example: CARDIOLOGIA
