  # ══════════════════════════════════════════
  # TUTORES — CONSENTIMENTO (RN-060 a RN-062)
  # ══════════════════════════════════════════
  /tutores/me/consentimento:
    get:
      tags: [Tutores]
      summary: Ler o consentimento do tutor autenticado
      description: |
        Estado atual do aceite LGPD e do consentimento de compartilhamento em rede,
        com as respectivas datas de registro. Somente `TUTOR`.
      responses:
        '200':
          description: Consentimento atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConsentimentoResponse'
              example:
                lgpdAceito: true
                dataLgpdAceito: "2026-09-05"
                consentimentoRede: true
                dataConsentimentoRede: "2026-09-05"
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Usuário autenticado não é TUTOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Somente tutores possuem consentimento LGPD/rede

    put:
      tags: [Tutores]
      summary: Registrar ou revogar consentimento
      description: |
        **RN-060** — o aceite LGPD é registrado com data no momento em que passa a `true`.

        **RN-064/066** — `consentimentoRede: true` abre o histórico completo do animal
        a qualquer vet com vínculo clínico; `false` restringe o vet ao que ele mesmo
        produziu.

        **RN-062** — revogar (`false`) limpa a data do consentimento de rede e passa a
        valer nos acessos seguintes, **sem apagar** os registros clínicos já produzidos.

        Ambos os campos são obrigatórios: o `PUT` grava o estado inteiro, não um patch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TutorConsentimentoRequest'
            examples:
              aceitar_tudo:
                summary: Aceitar LGPD e liberar a rede (passo 5 do roteiro)
                value:
                  lgpdAceito: true
                  consentimentoRede: true
              revogar_rede:
                summary: Manter LGPD, revogar o compartilhamento em rede (RN-062)
                value:
                  lgpdAceito: true
                  consentimentoRede: false
      responses:
        '200':
          description: Consentimento atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorConsentimentoResponse'
              example:
                lgpdAceito: true
                dataLgpdAceito: "2026-09-05"
                consentimentoRede: false
                dataConsentimentoRede: null
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  # ══════════════════════════════════════════
  # ANIMAIS (RN-081)
  # ══════════════════════════════════════════
  /animais:
    post:
      tags: [Animais]
      summary: Cadastrar animal
      description: |
        Somente `TUTOR`; o animal nasce vinculado ao tutor autenticado — não há como
        cadastrar animal para outra pessoa.

        **RN-081** — `peso` é obrigatório e maior que zero.
        **RN-068** — `alergias` alimenta os alertas de segurança do histórico clínico,
        que nunca podem ser ocultados do Responsável.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalRequest'
            examples:
              completo:
                summary: Thor — cadastro clínico completo (passo 4 do roteiro)
                value:
                  nome: Thor
                  raca: Golden Retriever
                  sexo: M
                  dataNascimento: "2021-03-14"
                  peso: 32.40
                  especieId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  urlFoto: https://cdn.vetly.com.br/animais/thor.jpg
                  castrado: true
                  condicoesPreexistentes: Displasia coxofemoral leve diagnosticada em 2024.
                  alergias: Alergia a dipirona.
                  medicacoesEmUso: Condroitina 500mg, 1x ao dia.
              minimo:
                summary: Apenas os campos obrigatórios
                value:
                  nome: Mel
                  raca: SRD
                  sexo: F
                  peso: 4.10
                  especieId: d4e5f6a7-b8c9-0123-def1-234567890123
                  castrado: false
      responses:
        '201':
          description: Animal cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
              example:
                id: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
                nome: Thor
                raca: Golden Retriever
                sexo: M
                dataNascimento: "2021-03-14"
                peso: 32.40
                especie: CAO
                urlFoto: https://cdn.vetly.com.br/animais/thor.jpg
                castrado: true
                condicoesPreexistentes: Displasia coxofemoral leve diagnosticada em 2024.
                alergias: Alergia a dipirona.
                medicacoesEmUso: Condroitina 500mg, 1x ao dia.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Usuário autenticado não é TUTOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Somente tutores podem gerenciar animais
        '404':
          description: Espécie inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: "Espécie não encontrada: b2c3d4e5-f6a7-8901-bcde-f12345678901"

    get:
      tags: [Animais]
      summary: Listar os animais do tutor autenticado
      description: Página de 10 registros ordenada por nome. Só retorna animais do próprio tutor.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Página de animais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAnimalResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /animais/{id}:
    get:
      tags: [Animais]
      summary: Buscar animal por ID
      description: Retorna `403` se o animal for de outro tutor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
      responses:
        '200':
          description: Animal encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

    put:
      tags: [Animais]
      summary: Atualizar animal
      description: |
        Substituição completa — envie todos os campos obrigatórios, inclusive `peso` (RN-081).
        Somente o tutor dono.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalRequest'
            example:
              nome: Thor
              raca: Golden Retriever
              sexo: M
              dataNascimento: "2021-03-14"
              peso: 33.10
              especieId: b2c3d4e5-f6a7-8901-bcde-f12345678901
              urlFoto: https://cdn.vetly.com.br/animais/thor.jpg
              castrado: true
              condicoesPreexistentes: Displasia coxofemoral leve diagnosticada em 2024.
              alergias: Alergia a dipirona e a carprofeno.
              medicacoesEmUso: Condroitina 500mg, 1x ao dia.
      responses:
        '200':
          description: Animal atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimalResponse'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

    delete:
      tags: [Animais]
      summary: Excluir animal
      description: Somente o tutor dono.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
      responses:
        '204':
          description: Animal removido
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Animal com consultas/prontuário vinculados

  # ══════════════════════════════════════════
  # COLMEIA (RN-064 a RN-068)
  # ══════════════════════════════════════════
  /animais/{animalId}/historico:
    get:
      tags: [Colmeia]
      summary: Ler o histórico clínico do animal
      description: |
        A mesma rota serve os dois papéis, com regras diferentes.

        **Tutor dono** — vê o histórico do próprio animal. Registros marcados como
        ocultos não aparecem, **exceto** os marcados como alerta de segurança, que
        nunca são ocultáveis (**RN-068**). Não gera log.

        **Veterinário** — **RN-064**: o acesso é concedido automaticamente a quem tem
        ao menos uma consulta **não cancelada** com o animal; sem vínculo clínico,
        `403`. O escopo depende do consentimento do tutor:

        | `consentimentoRede` do tutor | O que o vet vê | `baseAcesso` gravada |
        |---|---|---|
        | `true` | histórico completo do animal | `CONSENTIMENTO_REDE` |
        | `false` | apenas as evoluções que ele mesmo produziu (**RN-066**) | `ATENDIMENTO_DIRETO` |

        **RN-067** — todo acesso de veterinário grava uma linha em
        `TB_LOG_ACESSO_PRONTUARIO`, consultável pelo tutor em `/logs-acesso`.
      parameters:
        - name: animalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
        - name: contexto
          in: query
          required: false
          schema:
            type: string
          description: |
            Texto livre gravado no log de acesso (ignorado quando quem lê é o tutor).
            Use-o para dizer *por que* o histórico foi aberto.
          example: Consulta de retorno
      responses:
        '200':
          description: Histórico visível para o solicitante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvolucaoClinicaResponse'
              examples:
                com_consentimento_rede:
                  summary: Vet com vínculo clínico e consentimento de rede ativo
                  value:
                    - id: 6b2f9d40-8e17-4a35-9c82-0d3f7b1a5e26
                      anotacoes: Claudicação grau II em MPE. Anti-inflamatório por 5 dias e repouso.
                      dataConsulta: "2026-10-14T14:30:00"
                      veterinarioNome: Dra. Ana Oliveira
                      alertaSeguranca: false
                    - id: 0f5a3c78-1d92-4b60-8e47-9c2a6d5f3b18
                      anotacoes: Reação adversa a dipirona registrada — não reutilizar.
                      dataConsulta: "2025-06-02T11:00:00"
                      veterinarioNome: Dr. Carlos Menezes
                      alertaSeguranca: true
                sem_consentimento_rede:
                  summary: Sem consentimento — só o que o próprio vet produziu (RN-066)
                  value:
                    - id: 6b2f9d40-8e17-4a35-9c82-0d3f7b1a5e26
                      anotacoes: Claudicação grau II em MPE. Anti-inflamatório por 5 dias e repouso.
                      dataConsulta: "2026-10-14T14:30:00"
                      veterinarioNome: Dra. Ana Oliveira
                      alertaSeguranca: false
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Sem vínculo clínico, animal de outro tutor, ou papel ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                sem_vinculo:
                  value:
                    error: "Colmeia: veterinário não possui nenhuma consulta com este animal — acesso não concedido"
                outro_tutor:
                  value:
                    error: Animal não pertence ao tutor autenticado
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /animais/{animalId}/logs-acesso:
    get:
      tags: [Colmeia]
      summary: Listar os acessos ao histórico do animal
      description: |
        **RN-067** — trilha de auditoria visível ao Responsável: quem acessou, quando,
        em que contexto e sob qual base legal. Somente o `TUTOR` dono do animal.
        Página de 20 registros, do acesso mais recente para o mais antigo.
      parameters:
        - name: animalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Página de acessos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageLogAcessoProntuarioResponse'
              example:
                content:
                  - id: 2e9c4b81-3d67-45a0-b8f2-1c7e5a9d0f34
                    dataHoraAcesso: "2026-10-15T09:41:02"
                    contextoAcesso: Correção do prontuário
                    baseAcesso: ATENDIMENTO_DIRETO
                    veterinarioNome: Dra. Ana Oliveira
                  - id: b73d0a15-4c86-42e9-9f01-8d5b2c7e3a64
                    dataHoraAcesso: "2026-10-14T14:35:18"
                    contextoAcesso: Consulta de retorno
                    baseAcesso: CONSENTIMENTO_REDE
                    veterinarioNome: Dra. Ana Oliveira
                totalElements: 2
                totalPages: 1
                number: 0
                size: 20
                first: true
                last: true
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  # ══════════════════════════════════════════
  # PRONTUÁRIO (RN-063, RN-088, RN-089)
  # ══════════════════════════════════════════
  /animais/{animalId}/prontuario:
    post:
      tags: [Prontuário]
      summary: Criar o prontuário original do animal
      description: |
        **RN-063** — o prontuário pertence ao animal, não ao veterinário nem à clínica.

        Só pode criar quem é `VETERINARIO` **e** tem vínculo clínico com o animal
        (gate da Colmeia — RN-064). Existe **um único** prontuário original por animal:
        a segunda tentativa devolve `409`; a partir daí, use `/correcoes`.

        Gera log de acesso com contexto `Criação do prontuário` (RN-067).
      parameters:
        - name: animalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProntuarioRequest'
            example:
              conteudoClinico: |
                Anamnese: claudicação em MPE há 3 dias, sem trauma relatado.
                Exame físico: dor à extensão do quadril esquerdo; FC 92 bpm; T 38,6 °C.
                Conduta: radiografia de quadril e anti-inflamatório por 5 dias.
      responses:
        '201':
          description: Prontuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProntuarioResponse'
              example:
                id: 8c5f1d29-7a34-4e6b-91c0-2d8b4f7a3e15
                conteudoClinico: "Anamnese: claudicação em MPE há 3 dias..."
                dataUltimaAtualizacao: "2026-10-14"
                original: true
                dataHoraCorrecao: null
                crmvSolicitanteCorrecao: null
                justificativaCorrecao: null
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Não é veterinário, ou não tem vínculo clínico com o animal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Somente veterinários podem escrever no prontuário
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Animal já possui prontuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Este animal já possui um prontuário — use a correção para atualizá-lo

    get:
      tags: [Prontuário]
      summary: Ler o prontuário completo (original + correções)
      description: |
        Devolve a lista em ordem cronológica: o original na posição 0, seguido de cada
        correção. **RN-088** — o original nunca é sobrescrito, então ele sempre aparece.

        **Tutor dono** — leitura livre, sem log.
        **Veterinário** — exige vínculo clínico (RN-064) e grava log com contexto
        `Leitura do prontuário` (RN-067).
      parameters:
        - name: animalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
      responses:
        '200':
          description: Histórico do prontuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProntuarioResponse'
              example:
                - id: 8c5f1d29-7a34-4e6b-91c0-2d8b4f7a3e15
                  conteudoClinico: "Conduta: radiografia de quadril e anti-inflamatório por 5 dias."
                  dataUltimaAtualizacao: "2026-10-14"
                  original: true
                  dataHoraCorrecao: null
                  crmvSolicitanteCorrecao: null
                  justificativaCorrecao: null
                - id: 4b7e0a63-1c58-49d2-8f36-5a9d2e1c7b40
                  conteudoClinico: "Conduta: radiografia de quadril e anti-inflamatório por 7 dias (corrigido)."
                  dataUltimaAtualizacao: "2026-10-16"
                  original: false
                  dataHoraCorrecao: "2026-10-16T08:22:31"
                  crmvSolicitanteCorrecao: SP-98765
                  justificativaCorrecao: Ajuste de posologia após revisão do laudo radiográfico.
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: Animal inexistente ou ainda sem prontuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: "Animal ainda não possui prontuário: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04"

  /animais/{animalId}/prontuario/correcoes:
    post:
      tags: [Prontuário]
      summary: Corrigir o prontuário (nova versão vinculada à original)
      description: |
        **RN-088** — a correção **nunca** sobrescreve: cria uma nova linha apontando
        para o prontuário original, carimbada com data, hora e o CRMV de quem corrigiu.
        Ambas as versões continuam visíveis em `GET /animais/{animalId}/prontuario`.

        **RN-089** — fora da janela de 24h da criação do original, `justificativa` é
        **obrigatória**; sem ela a API responde `409`. Dentro da janela, a justificativa
        enviada é descartada.

        Requer `VETERINARIO` com vínculo clínico (RN-064) e gera log de acesso (RN-067).
      parameters:
        - name: animalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProntuarioCorrecaoRequest'
            examples:
              dentro_24h:
                summary: Dentro da janela de 24h — justificativa dispensada (RN-088)
                value:
                  conteudoClinico: "Conduta: radiografia de quadril e anti-inflamatório por 7 dias (corrigido)."
              fora_24h:
                summary: Fora da janela de 24h — justificativa obrigatória (RN-089)
                value:
                  conteudoClinico: "Conduta: radiografia de quadril e anti-inflamatório por 7 dias (corrigido)."
                  justificativa: Ajuste de posologia após revisão do laudo radiográfico.
      responses:
        '201':
          description: Correção registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProntuarioResponse'
              example:
                id: 4b7e0a63-1c58-49d2-8f36-5a9d2e1c7b40
                conteudoClinico: "Conduta: radiografia de quadril e anti-inflamatório por 7 dias (corrigido)."
                dataUltimaAtualizacao: "2026-10-16"
                original: false
                dataHoraCorrecao: "2026-10-16T08:22:31"
                crmvSolicitanteCorrecao: SP-98765
                justificativaCorrecao: Ajuste de posologia após revisão do laudo radiográfico.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: Animal inexistente ou ainda sem prontuário
        '409':
          description: Correção fora da janela de 24h sem justificativa (RN-089)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Correção fora da janela de 24h da criação do prontuário original exige justificativa (RN-089)

  # ══════════════════════════════════════════
  # CONSULTAS (RN-003, RN-008, RN-012, RN-038)
  # ══════════════════════════════════════════
  /consultas:
    post:
      tags: [Consultas]
      summary: Agendar consulta
      description: |
        **RN-003** — a consulta é atribuída diretamente ao veterinário escolhido
        (não há clínica designando profissional no escopo do Java).

        Somente `TUTOR`, e apenas para animal do próprio tutor. A consulta nasce
        `AGENDADA`. `valor` é registro contábil: **não há pagamento** nesta API, então
        RN-041 a RN-045 (reembolso) não se aplicam.

        Agendar também cria o vínculo clínico que a Colmeia usa para liberar o histórico
        ao vet (**RN-064**).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsultaRequest'
            example:
              animalId: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
              veterinarioId: 3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
              dataHora: "2026-10-14T14:30:00"
              valor: 180.00
              observacao: Thor está mancando da pata traseira esquerda há três dias.
      responses:
        '201':
          description: Consulta agendada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
              example:
                id: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
                dataHora: "2026-10-14T14:30:00"
                status: AGENDADA
                valor: 180.00
                observacao: Thor está mancando da pata traseira esquerda há três dias.
                animalId: 9a1c7f52-4b6d-4f0e-8f31-2c6a5d7e1b04
                animalNome: Thor
                veterinarioId: 3f8b1e90-2d47-4c6a-9b15-7e0d4a2c8f61
                veterinarioNome: Dra. Ana Oliveira
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Não é tutor, ou o animal é de outro tutor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Somente tutores podem agendar consultas
        '404':
          description: Animal ou veterinário inexistente

    get:
      tags: [Consultas]
      summary: Listar consultas do usuário autenticado
      description: |
        Página de 10 registros, da mais recente para a mais antiga.
        O recorte segue o papel: `TUTOR` vê as consultas dos seus animais;
        `VETERINARIO` vê aquelas em que é o profissional designado.
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Página de consultas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageConsultaResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Papel sem visão de agenda (ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Somente tutores ou veterinários podem listar consultas

  /consultas/{id}:
    get:
      tags: [Consultas]
      summary: Buscar consulta por ID
      description: Visível ao tutor dono do animal e ao veterinário designado; qualquer outro recebe `403`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
      responses:
        '200':
          description: Consulta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultaResponse'
        '401':
