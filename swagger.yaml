  # ══════════════════════════════════════════
  # EXAMES (RN-103, RN-104)
  # ══════════════════════════════════════════
  /consultas/{consultaId}/solicitacoes-exame:
    post:
      tags: [Exames]
      summary: Solicitar exames na consulta
      description: |
        **RN-103** — o exame é solicitado dentro da plataforma e fica vinculado à
        consulta e, por ela, ao histórico do animal.

        Somente o veterinário **designado na consulta**. Cada consulta comporta **uma**
        solicitação, com N itens; cada item nasce `SOLICITADO` e `liberadoResponsavel: false`.

        A notificação de preparo ao Responsável não é enviada aqui — Notificações é
        escopo do `.NET`; a orientação vai no campo `observacao`.
      parameters:
        - name: consultaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitacaoExameRequest'
            example:
              observacao: Jejum de 8 horas antes da coleta.
              itens:
                - nomeExame: Hemograma completo
                - nomeExame: Radiografia de quadril
      responses:
        '201':
          description: Solicitação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoExameResponse'
              example:
                id: e21b6c74-9f3a-4d18-b5e7-0c4a2f8d6b19
                observacao: Jejum de 8 horas antes da coleta.
                consultaId: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
                animalNome: Thor
                veterinarioNome: Dra. Ana Oliveira
                itens:
                  - id: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
                    nomeExame: Hemograma completo
                    status: SOLICITADO
                    dataSolicitacao: "2026-10-14"
                    dataResultado: null
                    descricaoResultado: null
                    liberadoResponsavel: false
                    dataLiberacaoResponsavel: null
                    anexos: []
                  - id: 9e0b5d34-7a16-42f8-b93c-1d5e8a0c6f27
                    nomeExame: Radiografia de quadril
                    status: SOLICITADO
                    dataSolicitacao: "2026-10-14"
                    dataResultado: null
                    descricaoResultado: null
                    liberadoResponsavel: false
                    dataLiberacaoResponsavel: null
                    anexos: []
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Não é o veterinário da consulta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Somente o veterinário da consulta pode solicitar exames
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: A consulta já tem uma solicitação de exame
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Já existe uma solicitação de exame para esta consulta

    get:
      tags: [Exames]
      summary: Ler a solicitação de exame da consulta
      description: |
        **RN-104** — a resposta é filtrada pelo papel:

        - **Veterinário da consulta** — vê tudo, liberado ou não.
        - **Tutor dono do animal** — vê os itens e seus status, mas
          `descricaoResultado`, `dataResultado` e `anexos` só aparecem depois que o
          vet libera o item (`liberadoResponsavel: true`). Antes disso vêm `null` e
          lista vazia — o item existe, o resultado não é revelado.
      parameters:
        - name: consultaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
      responses:
        '200':
          description: Solicitação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoExameResponse'
              examples:
                visao_veterinario:
                  summary: Vet da consulta — resultado visível mesmo antes da liberação
                  value:
                    id: e21b6c74-9f3a-4d18-b5e7-0c4a2f8d6b19
                    observacao: Jejum de 8 horas antes da coleta.
                    consultaId: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
                    animalNome: Thor
                    veterinarioNome: Dra. Ana Oliveira
                    itens:
                      - id: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
                        nomeExame: Hemograma completo
                        status: ANALISADO
                        dataSolicitacao: "2026-10-14"
                        dataResultado: "2026-10-15"
                        descricaoResultado: Leucograma dentro da normalidade; leve anemia normocítica normocrômica.
                        liberadoResponsavel: false
                        dataLiberacaoResponsavel: null
                        anexos:
                          - id: 1a4e8c37-6b90-42d5-8e71-3f2c9d0a5b68
                            urlArquivo: https://cdn.vetly.com.br/exames/thor-hemograma-2026-10-14.pdf
                            mimeType: application/pdf
                            dataUpload: "2026-10-15"
                visao_tutor_nao_liberado:
                  summary: Tutor, item ainda não liberado — resultado e anexos ocultos (RN-104)
                  value:
                    id: e21b6c74-9f3a-4d18-b5e7-0c4a2f8d6b19
                    observacao: Jejum de 8 horas antes da coleta.
                    consultaId: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
                    animalNome: Thor
                    veterinarioNome: Dra. Ana Oliveira
                    itens:
                      - id: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
                        nomeExame: Hemograma completo
                        status: ANALISADO
                        dataSolicitacao: "2026-10-14"
                        dataResultado: null
                        descricaoResultado: null
                        liberadoResponsavel: false
                        dataLiberacaoResponsavel: null
                        anexos: []
                visao_tutor_liberado:
                  summary: Tutor, item liberado pelo vet — resultado e anexos visíveis
                  value:
                    id: e21b6c74-9f3a-4d18-b5e7-0c4a2f8d6b19
                    observacao: Jejum de 8 horas antes da coleta.
                    consultaId: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33
                    animalNome: Thor
                    veterinarioNome: Dra. Ana Oliveira
                    itens:
                      - id: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
                        nomeExame: Hemograma completo
                        status: RESULTADO_ENVIADO
                        dataSolicitacao: "2026-10-14"
                        dataResultado: "2026-10-15"
                        descricaoResultado: Leucograma dentro da normalidade; leve anemia normocítica normocrômica.
                        liberadoResponsavel: true
                        dataLiberacaoResponsavel: "2026-10-16"
                        anexos:
                          - id: 1a4e8c37-6b90-42d5-8e71-3f2c9d0a5b68
                            urlArquivo: https://cdn.vetly.com.br/exames/thor-hemograma-2026-10-14.pdf
                            mimeType: application/pdf
                            dataUpload: "2026-10-15"
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          description: Consulta inexistente ou sem solicitação de exame
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: "Consulta não possui solicitação de exame: c47d2a18-5e93-4b7f-a2d6-8b1f0e5c9d33"

  /solicitacoes-exame/itens/{itemId}/resultado:
    patch:
      tags: [Exames]
      summary: Registrar o resultado de um item
      description: |
        **RN-104 (parte 1)** — o vet lança o laudo. Aceito a partir de `SOLICITADO`
        ou `AGUARDANDO_RESULTADO`; o item passa a `ANALISADO` e recebe
        `dataResultado`/`dataAnalise` de hoje.

        Registrar **não** revela nada ao tutor — para isso é preciso liberar (`/liberar`).
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultadoExameRequest'
            example:
              descricaoResultado: Leucograma dentro da normalidade; leve anemia normocítica normocrômica.
      responses:
        '200':
          description: Resultado registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoExameItemResponse'
              example:
                id: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
                nomeExame: Hemograma completo
                status: ANALISADO
                dataSolicitacao: "2026-10-14"
                dataResultado: "2026-10-15"
                descricaoResultado: Leucograma dentro da normalidade; leve anemia normocítica normocrômica.
                liberadoResponsavel: false
                dataLiberacaoResponsavel: null
                anexos: []
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Item de uma consulta de outro veterinário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: Exame não pertence a uma consulta do veterinário autenticado
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Status incompatível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: "Só é possível registrar resultado a partir de SOLICITADO ou AGUARDANDO_RESULTADO — status atual: RESULTADO_ENVIADO"

  /solicitacoes-exame/itens/{itemId}/anexos:
    post:
      tags: [Exames]
      summary: Anexar arquivo de resultado
      description: |
        **RN-104 (parte 2)** — o laudo em arquivo. A API guarda **a URL**, não o binário:
        hospede o PDF/imagem antes e informe `urlArquivo` + `mimeType`.

        Somente o vet da consulta. Os anexos seguem a mesma regra de visibilidade do
        resultado: o tutor só os enxerga depois da liberação.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnexoExameRequest'
            example:
              urlArquivo: https://cdn.vetly.com.br/exames/thor-hemograma-2026-10-14.pdf
              mimeType: application/pdf
      responses:
        '201':
          description: Anexo registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnexoExameResponse'
              example:
                id: 1a4e8c37-6b90-42d5-8e71-3f2c9d0a5b68
                urlArquivo: https://cdn.vetly.com.br/exames/thor-hemograma-2026-10-14.pdf
                mimeType: application/pdf
                dataUpload: "2026-10-15"
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /solicitacoes-exame/itens/{itemId}/liberar:
    patch:
      tags: [Exames]
      summary: Liberar o resultado ao Responsável
      description: |
        **RN-104 (parte 3)** — o resultado só chega ao Responsável **após liberação
        explícita do veterinário**. Este é o único ponto que torna laudo e anexos
        visíveis ao tutor.

        Exige o item em `ANALISADO` (ou seja, com resultado já registrado); grava
        `liberadoResponsavel: true` + `dataLiberacaoResponsavel` e move o status para
        `RESULTADO_ENVIADO` — que aqui significa **liberado ao Responsável**.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
      responses:
        '200':
          description: Item liberado ao Responsável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoExameItemResponse'
              example:
                id: 5d90f3a1-8c24-4e7b-9a03-6f1d8b2e4c57
                nomeExame: Hemograma completo
                status: RESULTADO_ENVIADO
                dataSolicitacao: "2026-10-14"
                dataResultado: "2026-10-15"
                descricaoResultado: Leucograma dentro da normalidade; leve anemia normocítica normocrômica.
                liberadoResponsavel: true
                dataLiberacaoResponsavel: "2026-10-16"
                anexos:
                  - id: 1a4e8c37-6b90-42d5-8e71-3f2c9d0a5b68
                    urlArquivo: https://cdn.vetly.com.br/exames/thor-hemograma-2026-10-14.pdf
                    mimeType: application/pdf
                    dataUpload: "2026-10-15"
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Item ainda não analisado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: "Só é possível liberar ao Responsável um exame já ANALISADO — status atual: SOLICITADO"

  /solicitacoes-exame/itens/{itemId}/cancelar:
    patch:
      tags: [Exames]
      summary: Cancelar um item de exame
      description: |
        Somente o vet da consulta. Não é possível cancelar item já liberado
        (`RESULTADO_ENVIADO`) nem já cancelado — resultado divulgado ao Responsável
        não se desfaz.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 9e0b5d34-7a16-42f8-b93c-1d5e8a0c6f27
      responses:
        '200':
          description: Item cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoExameItemResponse'
              example:
                id: 9e0b5d34-7a16-42f8-b93c-1d5e8a0c6f27
                nomeExame: Radiografia de quadril
                status: CANCELADO
                dataSolicitacao: "2026-10-14"
                dataResultado: null
                descricaoResultado: null
                liberadoResponsavel: false
                dataLiberacaoResponsavel: null
                anexos: []
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Item já liberado ou já cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                error: "Não é possível cancelar um exame já enviado ou já cancelado — status atual: RESULTADO_ENVIADO"
