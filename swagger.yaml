    put:
      tags: [Especialidades]
      summary: Atualizar especialidade
      description: O `id` vai **no corpo**, não na URL. Requer `ADMIN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecialidadeVet'
            example:
              id: c3d4e5f6-a7b8-9012-cdef-123456789012
              nome: CARDIOLOGIA
              descricao: Diagnóstico, tratamento e acompanhamento de cardiopatias em cães e gatos.
      responses:
        '201':
          description: Especialidade atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecialidadeVet'
        '400':
          description: Nenhuma especialidade com o `id` informado
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/AcessoNegado'

  /especialidades/{id}:
    get:
      tags: [Especialidades]
      summary: Buscar especialidade por ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
